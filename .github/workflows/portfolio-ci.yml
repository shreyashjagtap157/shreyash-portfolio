name: Portfolio CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Report dependency advisories
        continue-on-error: true
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node <<'NODE'
          const fs = require('node:fs')
          let report
          try {
            report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-audit.json', 'utf8'))
          } catch {
            console.log('npm audit did not return a readable JSON report.')
            process.exit(0)
          }
          const advisories = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
            package: name,
            severity: item.severity,
            direct: item.isDirect,
            affectedRange: item.range,
            fixAvailable: item.fixAvailable,
            advisories: (item.via || []).map(advisory => typeof advisory === 'string'
              ? advisory
              : {
                  title: advisory.title,
                  url: advisory.url,
                  range: advisory.range,
                  cwe: advisory.cwe,
                  cvss: advisory.cvss && advisory.cvss.score,
                }),
          }))
          console.log(JSON.stringify({
            counts: report.metadata && report.metadata.vulnerabilities,
            advisories,
          }, null, 2))
          NODE
      - name: Build a compatible dependency-fix candidate
        id: dependency-fix
        continue-on-error: true
        run: |
          npm audit fix --package-lock-only
          npm ci
          mkdir -p "$RUNNER_TEMP/dependency-remediation"
          cp package-lock.json "$RUNNER_TEMP/dependency-remediation/package-lock.json"
      - name: Upload dependency-fix candidate
        if: steps.dependency-fix.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: dependency-remediation-candidate
          path: ${{ runner.temp }}/dependency-remediation/package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload browser-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
