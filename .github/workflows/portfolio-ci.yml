name: Portfolio CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Enforce dependency security audit
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node <<'NODE'
          const fs = require('node:fs')
          let report
          try {
            report = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/npm-audit.json', 'utf8'))
          } catch {
            console.error('npm audit did not return a readable JSON report; failing closed.')
            process.exit(1)
          }
          const advisories = Object.entries(report.vulnerabilities || {}).map(([name, item]) => ({
            package: name,
            severity: item.severity,
            direct: item.isDirect,
            affectedRange: item.range,
            fixAvailable: item.fixAvailable,
            advisories: (item.via || []).map(advisory => typeof advisory === 'string'
              ? advisory
              : {
                  title: advisory.title,
                  url: advisory.url,
                  range: advisory.range,
                  cwe: advisory.cwe,
                  cvss: advisory.cvss && advisory.cvss.score,
                }),
          }))
          const counts = report.metadata && report.metadata.vulnerabilities
          console.log(JSON.stringify({ counts, advisories }, null, 2))
          if (!counts || counts.total > 0) {
            console.error('Dependency audit failed: unresolved npm advisories remain.')
            process.exit(1)
          }
          NODE
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload browser-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
