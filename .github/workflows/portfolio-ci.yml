name: Portfolio CI

on:
  push:
    branches: [main, 'work/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        shell: bash
        run: |
          npm audit --json > npm-audit-report.json || true
          node - <<'NODE'
          const report = require('./npm-audit-report.json')
          const counts = report.metadata?.vulnerabilities ?? {}
          console.log('NPM_AUDIT_COUNTS=' + JSON.stringify(counts))
          for (const [name, finding] of Object.entries(report.vulnerabilities ?? {})) {
            console.log('NPM_AUDIT_FINDING=' + JSON.stringify({
              name,
              severity: finding.severity,
              direct: finding.isDirect,
              range: finding.range,
              fixAvailable: finding.fixAvailable,
              via: finding.via.map(item => typeof item === 'string' ? item : {
                title: item.title,
                url: item.url,
                range: item.range,
              }),
            }))
          }
          NODE
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload browser-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
